<div class="mermaid-diagram" #container>
  <div
    *ngIf="svgHtml && !renderError"
    class="mermaid-diagram__svg"
    [style.maxWidth]="maxWidth"
    [innerHTML]="svgHtml"
  ></div>

  <div *ngIf="renderError" class="mermaid-diagram__error">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>Diagram could not be rendered</span>
  </div>

  <div *ngIf="!svgHtml && !renderError && diagram" class="mermaid-diagram__loading">
    <span class="mermaid-diagram__spinner"></span>
  </div>
</div>
