<div class="validation-overlay">
  <div class="validation-dialog">
    <div class="validation-icon">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
        />
        <line x1="12" y1="9" x2="12" y2="13" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </svg>
    </div>
    <div class="validation-content">
      <h3 class="validation-title">Analysis Type Mismatch</h3>
      <p class="validation-message">{{ result.message }}</p>
      <div class="validation-actions">
        <button class="btn-suggestion" (click)="onProceedWithSuggestion()">
          Switch to {{ suggestedLabel }}
        </button>
        <button class="btn-original" (click)="onProceedWithOriginal()">
          Continue as {{ intendedLabel }}
        </button>
        <button class="btn-cancel" (click)="onCancel()">Cancel</button>
      </div>
    </div>
  </div>
</div>
