<!-- Home page: full-bleed, no shell chrome -->
<div *ngIf="isHome" class="app-home-outlet">
  <router-outlet></router-outlet>
</div>

<!-- All other pages: sidebar + header shell -->
<div *ngIf="!isHome" class="app-layout">

  <app-sidebar></app-sidebar>

  <div class="app-main">

    <header class="app-header">

      <app-global-search></app-global-search>

      <button class="header-btn header-btn-guide" (click)="openGuide()" title="Open LegacyLens Guide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        Guide
      </button>

      <button class="header-btn icon-only" (click)="theme.toggle()" [title]="theme.isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
        <svg *ngIf="theme.isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg *ngIf="!theme.isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span>Theme</span>
      </button>

      <button class="header-btn" (click)="openFeedback()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Feedback
      </button>

    </header>

    <div class="app-body">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>

<app-feedback-modal *ngIf="feedbackOpen" (close)="closeFeedback()"></app-feedback-modal>
<app-legacylens-guide *ngIf="guide.isOpen$ | async"></app-legacylens-guide>
