<div class="repo-intelligence" *ngIf="hasContent">

  <!-- ── Progress indicator (while building) ─────────────────────────────── -->
  <div class="ri-progress" *ngIf="isBuilding">
    <div class="progress-row">
      <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      <span class="progress-label">{{ stateLabel }}</span>
    </div>

    <div class="progress-steps">
      <div class="progress-step" [ngClass]="{'step-done': step1Done, 'step-active': step1Active}">
        <span class="step-icon">{{ step1Icon }}</span>
        <span class="step-name">Read Files</span>
      </div>
      <div class="progress-step" [ngClass]="{'step-done': step2Done, 'step-active': step2Active, 'step-pending': step2Pending}">
        <span class="step-icon">{{ step2Icon }}</span>
        <span class="step-name">Build Dependencies</span>
      </div>
      <div class="progress-step" [ngClass]="{'step-done': step3Done, 'step-active': step3Active, 'step-pending': step3Pending}">
        <span class="step-icon">{{ step3Icon }}</span>
        <span class="step-name">Detect Architecture</span>
      </div>
    </div>
  </div>

  <!-- ── Key Components ──────────────────────────────────────────────────── -->
  <div class="ri-section" *ngIf="!isBuilding && hasGraph">

    <button class="ri-section-header" (click)="toggleDeps()">
      <div class="ri-section-icon dep-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/>
          <path d="M6 9v12"/><path d="M18 9v3"/>
        </svg>
      </div>
      <span class="ri-section-title">Key Components</span>
      <span class="ri-section-meta">{{ nodeCount }} nodes · {{ edgeCount }} edges</span>
      <svg class="ri-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline [attr.points]="depsExpanded ? '18 15 12 9 6 15' : '6 9 12 15 18 9'"/>
      </svg>
    </button>

    <div class="ri-dep-body" *ngIf="depsExpanded">
      <div class="key-component-row" *ngFor="let c of keyComponents">
        <div class="kc-header">
          <span class="kc-name">{{ c.ranking.node.name }}</span>
          <span class="kc-role-badge" [ngClass]="c.roleClass">{{ c.role }}</span>
        </div>
        <p class="kc-desc">{{ c.description }}</p>
        <div class="kc-counts">
          <span class="kc-count inbound-count" title="Files that depend on this component">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>
            </svg>
            {{ c.ranking.inbound }} in
          </span>
          <span class="kc-count outbound-count" title="Files this component depends on">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
            </svg>
            {{ c.ranking.outbound }} out
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Complete but no meaningful results ──────────────────────────────── -->
  <div class="ri-empty" *ngIf="!isBuilding && !hasGraph && isComplete">
    <span class="ri-empty-text">No dependency relationships detected in uploaded files.</span>
  </div>

</div>
