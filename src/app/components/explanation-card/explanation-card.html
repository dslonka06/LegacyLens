<div class="explanation-card">

  <!-- Header -->
  <div class="ec-header">
    <div class="ec-header-left">
      <div class="ec-ai-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/>
          <path d="M12 8v4l3 3"/>
        </svg>
        AI
      </div>
      <span class="ec-title">{{ title }}</span>
    </div>
    <div class="ec-header-actions">
      <button class="ec-btn-icon ec-btn-dismiss" (click)="dismiss.emit()" title="Dismiss">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Loading state -->
  <div class="ec-loading" *ngIf="isLoading">
    <div class="ec-loading-row">
      <svg class="ec-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      <span>Generating explanation from repository knowledge…</span>
    </div>
    <div class="ec-skeleton">
      <div class="ec-sk-line long"></div>
      <div class="ec-sk-line medium"></div>
      <div class="ec-sk-line long"></div>
      <div class="ec-sk-line short"></div>
    </div>
  </div>

  <!-- Error state -->
  <div class="ec-error" *ngIf="error && !isLoading">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <div class="ec-error-body">
      <span class="ec-error-title">Explanation unavailable</span>
      <span class="ec-error-desc">{{ error }}</span>
    </div>
  </div>

  <!-- Content -->
  <div class="ec-body" *ngIf="content && !isLoading && !error">
    <ng-container *ngFor="let para of paragraphs">
      <h4 class="ec-heading" *ngIf="isHeading(para)">{{ headingText(para) }}</h4>
      <p class="ec-para" *ngIf="!isHeading(para)">{{ para }}</p>
    </ng-container>
  </div>

</div>
