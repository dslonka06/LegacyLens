<div class="editor-panel">

  <!-- VS Code-style tab row -->
  <div class="editor-tabs">
    <div class="editor-tab active">

      <!-- Language-aware file icon -->
      <ng-container [ngSwitch]="langIconType">

        <!-- C# -->
        <svg *ngSwitchCase="'csharp'" class="tab-file-icon lang-icon-csharp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke-width="1.5"/>
          <text x="7" y="16" font-size="9" font-weight="700" fill="currentColor" stroke="none" font-family="monospace">C#</text>
        </svg>

        <!-- TypeScript -->
        <svg *ngSwitchCase="'typescript'" class="tab-file-icon lang-icon-typescript" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="3" fill="currentColor" opacity="0.15" stroke="currentColor"/>
          <text x="5.5" y="16" font-size="8.5" font-weight="800" fill="currentColor" stroke="none" font-family="monospace">TS</text>
        </svg>

        <!-- JavaScript -->
        <svg *ngSwitchCase="'javascript'" class="tab-file-icon lang-icon-javascript" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="3" fill="currentColor" opacity="0.15" stroke="currentColor"/>
          <text x="5.5" y="16" font-size="8.5" font-weight="800" fill="currentColor" stroke="none" font-family="monospace">JS</text>
        </svg>

        <!-- SQL / Database -->
        <svg *ngSwitchCase="'database'" class="tab-file-icon lang-icon-sql" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="6" rx="8" ry="3"/>
          <path d="M4 6v4c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/>
          <path d="M4 10v4c0 1.66 3.58 3 8 3s8-1.34 8-3v-4"/>
        </svg>

        <!-- Python -->
        <svg *ngSwitchCase="'python'" class="tab-file-icon lang-icon-python" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C9.24 2 7 3.12 7 5v3h5v1H5.5C3.57 9 2 10.57 2 12.5S3.57 16 5.5 16H7v-3c0-1.88 2.24-3 5-3s5 1.12 5 3v3h1.5c1.93 0 3.5-1.57 3.5-3.5S19.43 9 17.5 9H17V6c0-1.88-2.24-3-5-4z" stroke-width="1.5"/>
        </svg>

        <!-- HTML -->
        <svg *ngSwitchCase="'html'" class="tab-file-icon lang-icon-html" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>

        <!-- JSON -->
        <svg *ngSwitchCase="'json'" class="tab-file-icon lang-icon-json" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1"/>
          <path d="M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/>
        </svg>

        <!-- Generic file fallback -->
        <svg *ngSwitchDefault class="tab-file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
        </svg>

      </ng-container>

      <span class="tab-name">{{ fileName }}</span>
      <button class="tab-close-btn" (click)="clearFile()" title="Clear" *ngIf="code.trim()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Toolbar: two rows — meta strip on top, actions on bottom -->
  <div class="editor-toolbar">

    <!-- Row 1: file metadata -->
    <div class="toolbar-meta-row">
      <div class="lang-badge" [ngClass]="langBadgeClass">{{ detectedLanguage }}</div>
      <span class="toolbar-meta">{{ lineCount }} lines</span>

      <div class="ai-loading" *ngIf="isAnalyzing">
        <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        Analyzing…
      </div>

      <div class="last-analyzed" *ngIf="lastAnalyzedLabel && !isAnalyzing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        {{ lastAnalyzedLabel }}
      </div>

      <div class="ai-fallback" *ngIf="aiError && !isAnalyzing" [title]="aiError">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        Pattern analysis
      </div>

      <div class="multi-file-badge" *ngIf="isMultiFileWorkspace" [title]="uploadedFiles.length + ' files uploaded'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        +{{ additionalFileCount }} more
      </div>
    </div>

    <!-- Row 2: upload controls + analyze -->
    <div class="toolbar-action-row">
      <button class="btn btn-ghost" (click)="fileInput.click()" [disabled]="isLoadingFile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>{{ isLoadingFile ? 'Loading…' : 'Files' }}</span>
      </button>
      <input #fileInput type="file" accept=".cs,.ts,.sql,.txt,.js,.py,.html,.css,.scss,.json,.xml,.md,.csproj,.yaml,.yml" multiple hidden (change)="onFileSelected($event)">

      <button class="btn btn-ghost" *ngIf="!hideFolderUpload" (click)="folderInput.click()" [disabled]="isLoadingFile" title="Upload a folder or project">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Folder</span>
      </button>
      <input #folderInput type="file" [attr.webkitdirectory]="''" hidden (change)="onFolderSelected($event)">

      <button
        class="btn btn-primary"
        (click)="analyzeCode()"
        [disabled]="!code.trim() || isAnalyzing || isLoadingFile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span>{{ isAnalyzing ? 'Analyzing…' : 'Analyze Code' }}</span>
      </button>
    </div>

  </div>

  <!-- Monaco Editor -->
  <div class="monaco-container">
    <ngx-monaco-editor
      class="monaco-editor-instance"
      [options]="editorOptions"
      [(ngModel)]="code"
      (onInit)="onEditorInit($event)">
    </ngx-monaco-editor>
  </div>

</div>
