<div class="feedback-overlay" (click)="dismiss()">
  <div class="feedback-modal" (click)="$event.stopPropagation()">

    <ng-container *ngIf="!submitted">

      <div class="feedback-modal-header">
        <h2>Share Feedback</h2>
        <button class="modal-close-btn" (click)="dismiss()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="feedback-question">How was this analysis?</div>

      <div class="feedback-rating-row">
        <button
          *ngFor="let r of ratings"
          class="rating-btn"
          [class.selected]="rating === r"
          (click)="selectRating(r)">
          {{ r }}
        </button>
      </div>

      <textarea
        class="feedback-textarea"
        placeholder="Additional comments (optional)"
        [(ngModel)]="comment"
        rows="3">
      </textarea>

      <button
        class="feedback-submit-btn"
        [disabled]="!rating"
        (click)="submit()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Submit
      </button>

    </ng-container>

    <ng-container *ngIf="submitted">
      <div class="feedback-submitted">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <strong>Thanks for the feedback!</strong>
        <p>Your response has been recorded.</p>
      </div>
    </ng-container>

  </div>
</div>
