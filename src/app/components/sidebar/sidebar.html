<aside class="sidebar">

  <!-- Expanded brand -->
  <div class="sidebar-brand" *ngIf="!collapsed">
    <div class="brand-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        <path d="M11 8v6M8 11h6"/>
      </svg>
    </div>
    <div class="brand-text">
      <div class="brand-name-row">
        <span class="brand-name">LegacyLens</span>
        <span class="brand-tag">AI</span>
      </div>
      <span class="brand-subtitle">AI-powered legacy code understanding</span>
    </div>
    <button class="collapse-btn" (click)="toggle()" title="Collapse sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
  </div>

  <!-- Collapsed brand -->
  <div class="sidebar-brand-collapsed" *ngIf="collapsed">
    <div class="brand-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        <path d="M11 8v6M8 11h6"/>
      </svg>
    </div>
    <button class="collapse-btn-collapsed" (click)="toggle()" title="Expand sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">

    <!-- New Analysis -->
    <div class="nav-section">
      <a routerLink="/analysis" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"
         class="nav-item new-analysis-btn" [title]="collapsed ? 'New Analysis' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span *ngIf="!collapsed">New Analysis</span>
      </a>
    </div>

    <!-- Main nav -->
    <div class="nav-section nav-main">

      <a routerLink="/analysis" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"
         class="nav-item" [title]="collapsed ? 'Analysis' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span *ngIf="!collapsed">Analysis</span>
      </a>

      <a routerLink="/repository-analysis" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Repository Analysis' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/>
          <path d="M18 9v1a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9"/>
          <line x1="12" y1="12" x2="12" y2="15"/>
        </svg>
        <span *ngIf="!collapsed">Repository Analysis</span>
      </a>

      <a routerLink="/history" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'History' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span *ngIf="!collapsed">History</span>
      </a>

      <a routerLink="/data-flow" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Data Flow' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span *ngIf="!collapsed">Data Flow</span>
      </a>

      <a routerLink="/architecture" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Architecture' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        <span *ngIf="!collapsed">Architecture</span>
      </a>

      <a routerLink="/risks" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Risks & Issues' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span *ngIf="!collapsed">Risks &amp; Issues</span>
      </a>

      <a routerLink="/modernization" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Modernization' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
        <span *ngIf="!collapsed">Modernization</span>
      </a>

      <a routerLink="/repository-navigation" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Repository Navigation' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span *ngIf="!collapsed">Repository Navigation</span>
      </a>

      <a routerLink="/documentation" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Documentation' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <span *ngIf="!collapsed">Documentation</span>
      </a>

      <a routerLink="/security" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Security' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span *ngIf="!collapsed">Security</span>
      </a>

    </div>

    <!-- Settings pinned at bottom -->
    <div class="nav-bottom">
      <a routerLink="/nav-playground" routerLinkActive="active" class="nav-item nav-item-dev" [title]="collapsed ? 'Nav Playground (Dev)' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        <span *ngIf="!collapsed">Nav Playground</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Settings' : ''">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span *ngIf="!collapsed">Settings</span>
      </a>
    </div>

  </nav>

</aside>
