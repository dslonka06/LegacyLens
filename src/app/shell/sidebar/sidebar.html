<aside class="sidebar" [class.sidebar--collapsed]="collapsed">

  <!-- Collapse toggle tab — mirrors the chat pull-out tab on the right edge -->
  <button class="sidebar-collapse-tab" (click)="toggleCollapse()" [title]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline *ngIf="!collapsed" points="15 18 9 12 15 6" />
      <polyline *ngIf="collapsed" points="9 18 15 12 9 6" />
    </svg>
  </button>
  <!-- Logo -->
  <a routerLink="/" class="sidebar-logo" title="Home">
    <div class="sidebar-logo-card">
      <img src="assets/logo.png" alt="SystemLens" width="28" height="28" />
    </div>
  </a>

  <!-- Nav icons -->
  <nav class="sidebar-nav">

    <ng-container *ngIf="!activeWorkspace">
      <a
        routerLink="/file-analysis"
        routerLinkActive="active"
        class="sidebar-btn"
        title="File Analysis"
      >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
          </svg>
        </div>
      </a>
      <a
        routerLink="/folder-analysis"
        routerLinkActive="active"
        class="sidebar-btn"
        title="Folder Analysis"
      >
        <div class="sidebar-btn-card">

          </svg>
        </div>
      </a>
      <a
