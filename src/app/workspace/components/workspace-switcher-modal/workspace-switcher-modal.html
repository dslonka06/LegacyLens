<div class="ws-switcher-overlay" (click)="dismiss()">
  <div class="ws-switcher-modal" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="wsm-header">
      <div class="wsm-title-group">
        <h2 class="wsm-title">{{ limitReached ? 'Workspace Limit Reached' : 'Workspaces' }}</h2>
        <p class="wsm-subtitle" *ngIf="limitReached">
          Delete a workspace to open a new one.
        </p>
        <p class="wsm-subtitle" *ngIf="!limitReached">{{ workspaces.length }}/3 open</p>
      </div>
      <div class="wsm-header-actions">
        <button
          class="wsm-new-btn"
          *ngIf="canCreate && !limitReached"
          (click)="newWorkspace()"
          title="New workspace"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          New
        </button>
        <button class="wsm-continue-btn" *ngIf="limitReached && pendingType" (click)="continueToExisting()">
          Continue
        </button>
        <button class="wsm-close-btn" (click)="dismiss()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Workspace list -->
    <div class="wsm-list">
      <div
        *ngFor="let ws of workspaces"
        class="wsm-item"
        [class.wsm-item-active]="ws.id === activeId"
        (click)="open(ws)"
      >
        <!-- Rename mode -->
        <ng-container *ngIf="renamingId === ws.id; else displayMode">
          <input
            class="wsm-rename-input"
            [(ngModel)]="renameValue"
            (keydown.enter)="commitRename(ws)"
            (keydown.escape)="cancelRename()"
            (blur)="commitRename(ws)"
            (click)="$event.stopPropagation()"
            autofocus
          />
        </ng-container>

        <!-- Display mode -->
        <ng-template #displayMode>
          <div class="wsm-item-info">
            <span class="wsm-item-name">{{ ws.name }}</span>
            <span class="wsm-item-type">{{ typeLabel(ws.type) }}</span>
          </div>
          <div class="wsm-item-right">
            <span class="wsm-status-badge" [ngClass]="statusClass(ws.status)">
              {{ statusLabel(ws.status) }}
            </span>
            <button class="wsm-icon-btn" (click)="startRename(ws, $event)" title="Rename">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
              </svg>
            </button>
            <button class="wsm-icon-btn wsm-icon-btn--danger" (click)="delete(ws, $event)" title="Delete">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                <path d="M9 6V4h6v2" />
              </svg>
            </button>
          </div>
        </ng-template>
      </div>

      <div class="wsm-empty" *ngIf="workspaces.length === 0">
        <p>No workspaces open.</p>
      </div>
    </div>

    <!-- AI Model -->
    <div class="wsm-divider"></div>
    <div class="wsm-ai-section">
      <label class="wsm-ai-label">AI Model</label>
      <div class="wsm-ai-row">
        <input
          class="wsm-ai-input"
          [(ngModel)]="aiModel"
          placeholder="e.g. claude-sonnet-4-6"
          (blur)="saveAiModel()"
          (keydown.enter)="saveAiModel()"
        />
      </div>
      <p class="wsm-ai-hint">Used for all analysis pipelines in this session.</p>
    </div>

  </div>
</div>
