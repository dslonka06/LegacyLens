<div class="new-analysis-page">

  <div class="new-analysis-topbar">
    <div class="new-analysis-topbar-actions">
      <app-theme-toggle></app-theme-toggle>
    </div>
  </div>

  <div class="new-analysis-body">

    <div class="new-analysis-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
        <line x1="16" y1="13" x2="8" y2="13" />
        <line x1="16" y1="17" x2="8" y2="17" />
      </svg>
      <span class="new-analysis-label-text">File Analysis</span>
    </div>

    <div
      class="drop-zone"
      [class.drop-zone--drag]="isDragging"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave()"
      (drop)="onDrop($event)"
    >
      <div class="drop-zone-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="12" y1="18" x2="12" y2="12" />
          <line x1="9" y1="15" x2="15" y2="15" />
        </svg>
      </div>

      <h2 class="drop-zone-title">Drop a file to begin</h2>
      <p class="drop-zone-desc">Drop a source file here, or browse to select one. SystemLens will build a full knowledge model and run AI analysis.</p>

      <div class="drop-zone-error" *ngIf="uploadError">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        {{ uploadError }}
      </div>

      <div class="drop-zone-actions">
        <button class="drop-zone-browse-btn" (click)="browse()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
          </svg>
          Browse File
        </button>
      </div>

      <span class="drop-zone-hint">Supports .ts .js .py .java .cs .go .rs .cpp and more</span>
    </div>

  </div>

  <app-workspace-switcher-modal
    *ngIf="showSwitcher"
    [limitReached]="switcherLimitReached"
    (close)="closeSwitcher()"
  ></app-workspace-switcher-modal>

</div>
