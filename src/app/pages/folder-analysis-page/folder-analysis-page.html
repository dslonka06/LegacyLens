<div class="tri-layout">

  <!-- ── Left: File Tree ───────────────────────────────────────────────────── -->
  <div class="tri-left" [style.width.px]="panelWidths[0]">
    <div class="tri-panel-header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
      <span>Files</span>
    </div>

    <div class="tri-tree-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        [(ngModel)]="treeSearch"
        placeholder="Search folder…"
        class="tri-tree-search-input"
        autocomplete="off">
      <button class="tri-tree-search-clear" *ngIf="treeSearch" (click)="treeSearch = ''">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="tri-tree-scroll">

      <!-- Search results -->
      <ng-container *ngIf="isSearching">
        <div *ngIf="filteredFiles.length === 0" class="tri-tree-empty">No files match "{{ treeSearch }}"</div>
        <div class="tree-file"
             *ngFor="let file of filteredFiles"
             [class.tree-file-active]="isFileSelected(file)"
             (click)="selectFile(file)">
          <span class="tree-file-icon">{{ fileIcon(file.extension) }}</span>
          <span class="tree-name">{{ file.name }}</span>
        </div>
      </ng-container>

      <!-- Full tree -->
      <ng-container *ngIf="!isSearching">
        <ng-container *ngIf="hasTree; else noTree">
          <ng-container *ngFor="let item of treeRoots">
            <ng-container *ngTemplateOutlet="treeItemTpl; context: { $implicit: item, depth: 0 }"></ng-container>
          </ng-container>
        </ng-container>
        <ng-template #noTree>
          <div class="tri-tree-empty">Upload a folder to explore</div>
        </ng-template>
      </ng-container>

    </div>
  </div>

  <app-resize-divider [minLeft]="160" [minRight]="320" (leftWidthChange)="onPanelResize(0, $event)"></app-resize-divider>

  <!-- ── Center: Code Editor ───────────────────────────────────────────────── -->
  <div class="tri-center" [style.width.px]="panelWidths[1]">
    <app-code-editor
      [readOnly]="true"
      [restoredFileName]="restoredFileName"
      [restoredSourceCode]="restoredSourceCode"
      (analyze)="onSessionCreated($event)"
      (workspaceReady)="onWorkspaceReady($event)"
      (filesUploaded)="onFilesUploaded($event)">
    </app-code-editor>
  </div>

  <app-resize-divider [minLeft]="320" [minRight]="200" (leftWidthChange)="onPanelResize(1, $event)"></app-resize-divider>

  <!-- ── Right: Intelligence Panel ───────────────────────────────────────── -->
  <div class="tri-right">
    <div class="tri-panel-header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
      </svg>
      <span>Intelligence</span>
    </div>

    <div class="tri-right-scroll">

      <app-workspace-panel (switchRequested)="openSwitcher()"></app-workspace-panel>

      <!-- Plain English Summary -->
      <div class="intel-card" *ngIf="aiSummary">
        <div class="intel-card-title">Folder Summary</div>
        <p class="intel-summary-text">{{ aiSummary }}</p>
      </div>

      <ng-container *ngIf="hasWorkspace">

        <!-- Explore Deeper -->
        <div class="intel-card">
          <div class="intel-card-title">Explore Deeper</div>
          <div class="intel-nav-list">
            <button class="intel-nav-btn" (click)="navigateTo('folder-analysis/architecture')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
              </svg>
              Architecture
            </button>
            <button class="intel-nav-btn" (click)="navigateTo('folder-analysis/data-flow')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
              </svg>
              Data Flow
            </button>
            <button class="intel-nav-btn" (click)="navigateTo('folder-analysis/code-recommendations')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
              </svg>
              Code Recommendations
            </button>
            <button class="intel-nav-btn" (click)="navigateTo('folder-analysis/documentation')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
              Documentation
            </button>
          </div>
        </div>

      </ng-container>
    </div>
  </div>

</div>

<!-- ── Tree item template ─────────────────────────────────────────────────── -->
<ng-template #treeItemTpl let-item let-depth="depth">

  <!-- Folder -->
  <div *ngIf="item.kind === 'folder'"
       class="tree-folder"
       [style.padding-left.px]="depth * 14 + 8"
       (click)="toggleFolder(item)">
    <svg class="tree-caret" [class.tree-caret-open]="item.expanded"
         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
    <svg class="tree-folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
    </svg>
    <span class="tree-name">{{ item.name }}</span>
    <span class="tree-count">{{ item.fileCount }}</span>
  </div>
  <ng-container *ngIf="item.kind === 'folder' && item.expanded">
    <ng-container *ngFor="let child of item.children">
      <ng-container *ngTemplateOutlet="treeItemTpl; context: { $implicit: child, depth: depth + 1 }"></ng-container>
    </ng-container>
  </ng-container>

  <!-- File -->
  <div *ngIf="item.kind === 'file'"
       class="tree-file"
       [class.tree-file-active]="isFileSelected(item)"
       [style.padding-left.px]="depth * 14 + 22"
       (click)="selectFile(item)">
    <span class="tree-file-icon">{{ fileIcon(item.extension) }}</span>
    <span class="tree-name">{{ item.name }}</span>
  </div>

</ng-template>

<app-workspace-switcher-modal
  *ngIf="showSwitcher"
  [limitReached]="switcherLimitReached"
  (close)="closeSwitcher()">
</app-workspace-switcher-modal>
