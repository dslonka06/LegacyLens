<div class="page-container">
  <h2 class="page-title">Explain Simpler</h2>

  <ng-container *ngIf="session; else noSession">

    <div class="card">
      <h3>File</h3>
      <p>{{ session.fileName }}</p>
    </div>

    <div class="card highlight">
      <h3>Beginner-Friendly Explanation</h3>
      <p>{{ session.analysis.simplifiedExplanation }}</p>
    </div>

  </ng-container>

  <ng-template #noSession>
    <div class="empty-state">
      <p>No analysis loaded. Run an analysis from the <a routerLink="/analysis">Analysis page</a>.</p>
    </div>
  </ng-template>
</div>
