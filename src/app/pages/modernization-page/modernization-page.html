<div class="insight-page">

  <div class="page-header">
    <div class="page-title">
      <div class="page-icon indigo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </div>
      <div>
        <h1>Modernization</h1>
        <div class="page-subtitle" *ngIf="session">
          {{ session.fileName }} · {{ totalCount }} opportunities
          <span class="source-badge ai" *ngIf="isAiPowered">AI</span>
          <span class="source-badge pattern" *ngIf="!isAiPowered">Pattern</span>
        </div>
      </div>
    </div>
  </div>

  <div class="no-session" *ngIf="!session">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
    </svg>
    <h3>No analysis available</h3>
    <p>Run an analysis first to view modernization opportunities.</p>
    <button class="go-btn" (click)="goToAnalysis()">Go to Analysis</button>
  </div>

  <div class="page-content" *ngIf="session">

    <!-- Empty state -->
    <div class="clean-banner" *ngIf="!totalCount">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      No significant modernization opportunities detected.
    </div>

    <!-- Recommendation cards -->
    <div class="doc-block" *ngIf="totalCount">
      <div class="doc-block-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
        </svg>
        Modernization Opportunities
      </div>
      <div class="mod-recommendation-list">
        <div class="mod-recommendation-card" *ngFor="let rec of recommendations">
          <div class="mod-rec-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="mod-rec-body">
            <span class="mod-rec-title">{{ rec.title }}</span>
            <span class="mod-rec-description" *ngIf="isAiPowered && rec.description !== rec.title">{{ rec.description }}</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
