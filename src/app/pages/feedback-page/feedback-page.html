<div class="insight-page">

  <div class="page-header">
    <div class="page-title">
      <div class="page-icon indigo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div>
        <h1>Feedback</h1>
        <p class="page-subtitle">Share your experience and suggest features</p>
      </div>
    </div>
  </div>

  <div class="page-content">

    <div class="settings-group">
      <div class="settings-group-label">Share Feedback</div>
      <div class="feedback-form">
        <textarea class="feedback-textarea" placeholder="Tell us what you think about LegacyLens…" rows="5"></textarea>
        <button class="submit-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          Submit Feedback
        </button>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-group-label">Feature Requests</div>
      <div class="feature-list">
        <div class="feature-item planned">
          <div class="feature-status">Planned</div>
          <span>AI-powered analysis via Claude API</span>
        </div>
        <div class="feature-item planned">
          <div class="feature-status">Planned</div>
          <span>Architecture diagram generation</span>
        </div>
        <div class="feature-item planned">
          <div class="feature-status">Planned</div>
          <span>Multi-file project analysis</span>
        </div>
        <div class="feature-item idea">
          <div class="feature-status idea">Idea</div>
          <span>Git diff analysis</span>
        </div>
        <div class="feature-item idea">
          <div class="feature-status idea">Idea</div>
          <span>Export analysis as PDF / Markdown</span>
        </div>
      </div>
    </div>

  </div>

</div>
