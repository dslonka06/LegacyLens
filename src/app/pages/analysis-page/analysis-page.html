<div class="analysis-page">

  <div class="editor-column">
    <app-code-editor
      [restoredFileName]="restoredFileName"
      [restoredSourceCode]="restoredSourceCode"
      (analyze)="onSessionCreated($event)"
      (workspaceReady)="onWorkspaceReady($event)">
    </app-code-editor>
  </div>

  <div class="results-column">

    <!-- Lightweight workspace context — visible for all workspace types -->
    <div class="workspace-context-strip" *ngIf="showWorkspaceSummary">
      <app-workspace-summary [profile]="workspaceProfile"></app-workspace-summary>
      <!-- Repository bridge — only for Project / Repository uploads -->
      <app-repository-callout
        *ngIf="showRepositoryCallout"
        [context]="workspaceContext">
      </app-repository-callout>
    </div>

    <app-analysis-panel [session]="session"></app-analysis-panel>

  </div>

</div>
